<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>恋愛診断｜心理テストの森</title>
  <link rel="stylesheet" href="style.css">
  <script src="love.js" defer></script>
</head>
<body>

<main class="container">

  <header class="site-header">
    <h1>🌷 恋愛診断</h1>
    <p>恋愛心理テストを楽しもう</p>
  </header>

  <!-- 診断一覧 -->
  <section id="love-menu" class="page-panel">

    <p class="page-intro">
      気になる恋愛診断を選んでね
    </p>

    <div class="quiz-menu">

      <button data-quiz="0">
        ① あなたの恋愛での本当の姿
        <span>恋愛中のあなたの特徴をチェック</span>
      </button>

      <button data-quiz="1">
        ② 恋をするときの不安との向き合い方
        <span>恋愛中の心の傾向をチェック</span>
      </button>

      <button data-quiz="2">
        ③ あなたが恋愛でいちばん大切にするもの
        <span>恋愛観をチェック</span>
      </button>

    </div>

    <div class="sub-buttons">
      <button id="love-home">
        🏠 トップに戻る
      </button>
    </div>

  </section>

  <!-- 問題画面 -->
  <section id="love-question" class="page-panel hidden">

    <p id="love-quiz-number" class="page-intro"></p>

    <h2 id="love-question-title"></h2>

    <p id="love-question-text" class="question"></p>

    <div id="love-choices" class="answer-list"></div>

    <div class="sub-buttons">
      <button id="love-menu-back">
        診断メニューに戻る
      </button>
    </div>

  </section>

  <!-- 結果画面 -->
  <section id="love-result" class="page-panel hidden">

    <p class="page-intro">
      💕 あなたの診断結果 💕
    </p>

    <h2 id="love-result-title"></h2>

    <div id="love-result-details"></div>

    <div class="sub-buttons">

      <button id="love-share">
        LINEでシェア
      </button>

      <button id="love-retry">
        もう一度診断する
      </button>

      <button id="love-result-menu">
        診断メニューに戻る
      </button>

      <button id="love-result-home">
        🏠 トップに戻る
      </button>

    </div>

  </section>

</main>

</body>
</html>

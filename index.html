<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7dce8">
<title>みんなの心理テスト</title>
<style>
:root{--pink:#d85f91;--deep:#70415d;--bg:#fff7fb;--line:#f0d6e3}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff8fb,#f5f0ff);color:#503849;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif}
main{max-width:780px;margin:auto;padding:20px 15px 45px}header{text-align:center;padding:25px 10px}
.eyebrow{color:var(--pink);font-weight:800;letter-spacing:.12em}h1{font-size:clamp(30px,7vw,44px);color:var(--deep);margin:8px 0}
p{line-height:1.85}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin:15px 0;box-shadow:0 8px 24px #a34c7910}
h2{color:var(--deep);margin:0 0 14px;font-size:22px}.categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.category{border:1px solid var(--line);border-radius:17px;background:#fffafd;padding:18px 12px;text-align:center;cursor:pointer;font:inherit;color:var(--deep)}
.category strong{display:block;font-size:17px;margin:7px 0}.category span{font-size:13px;color:#947b8b}
.category:hover,.category:focus,.choice:hover,.choice:focus{border-color:var(--pink);background:#fff1f7;outline:none}
.choices{display:grid;gap:10px}.choice{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:14px;border:1px solid var(--line);border-radius:15px;background:#fffafd;font:inherit;color:inherit;cursor:pointer}
.letter{display:grid;place-items:center;flex:0 0 36px;height:36px;border-radius:50%;background:#fbe0ec;color:var(--deep);font-weight:800}
button.primary{display:block;margin:16px auto 0;padding:12px 22px;border:0;border-radius:999px;background:var(--pink);color:white;font:inherit;font-weight:700;cursor:pointer}
.secondary{background:#f6e7ef!important;color:var(--deep)!important}.result{display:none}.tag{display:inline-block;background:#fff0f6;color:var(--deep);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700}
ul{padding-left:22px;line-height:1.9}footer{text-align:center;color:#947b8b;font-size:12px;line-height:1.7;margin-top:25px}
</style></head>
<body><main>
<header><div class="eyebrow">♡ 直感で選ぶだけ ♡</div><h1>みんなの心理テスト</h1><p>気になるジャンルを選んで、気軽に診断してみよう！</p></header>
<section class="card" id="home"><h2>ジャンルを選んでね</h2><div class="categories">
<button class="category" data-cat="personality">🪞<strong>性格診断</strong><span>あなたの意外な一面</span></button>
<button class="category" data-cat="friendship">🤝<strong>友情・人間関係</strong><span>友達との関わり方</span></button>
<button class="category" data-cat="deep">🌙<strong>深層心理</strong><span>心の奥の願い</span></button>
<button class="category" data-cat="fun">🎭<strong>おもしろ診断</strong><span>気軽に楽しむ心理テスト</span></button>
<button class="category" data-cat="love">💗<strong>恋愛</strong><span>恋の傾向や価値観</span></button>
</div></section>
<section class="card" id="quiz" style="display:none"><button class="primary secondary" id="back">← ジャンル選択に戻る</button><h2 id="catTitle"></h2><p id="question"></p><div class="choices" id="choices"></div></section>
<section class="card result" id="result"><span class="tag" id="tag"></span><h2 id="resultTitle"></h2><p id="intro"></p><ul id="details"></ul><p id="outro"></p><button class="primary" id="share">LINEでシェア</button><button class="primary secondary" id="retry">別の答えで診断</button></section>
<footer>※心理テストは娯楽としてお楽しみください。科学的な性格診断ではありません。</footer>
</main>
<script>
const data={
personality:{title:"性格診断",q:"休日に知らない街を訪れました。最初にしたいことは？",opts:["地図を見て名所を巡る","気になる路地を気ままに歩く","カフェに入って街の雰囲気を味わう","地元の人におすすめを聞く"],names:["計画派の探究者","自由な冒険家","感性豊かな観察者","人とつながる交流家"],intro:["あなたは見通しを立てて動くと安心できるタイプ。","あなたは好奇心に従って行動する自由人タイプ。","あなたは雰囲気や小さな発見を楽しむタイプ。","あなたは人との出会いから世界を広げるタイプ。"],details:["得意：段取りや目標設定。気をつけたい点：予定変更にこだわりすぎないこと。","得意：柔軟さと発想力。気をつけたい点：勢いだけで決めないこと。","得意：細やかな観察と感受性。気をつけたい点：考えすぎて疲れないこと。","得意：会話や協力。気をつけたい点：相手に合わせすぎないこと。"]},
friendship:{title:"友情・人間関係",q:"友達が落ち込んでいるとき、あなたがまずすることは？",opts:["じっくり話を聞く","気分転換に誘う","役立ちそうな解決策を考える","そっとそばにいる"],names:["聞き上手な寄り添いタイプ","ムードメーカータイプ","頼れるサポータータイプ","静かな安心感タイプ"],intro:["あなたは相手の気持ちを受け止めることを大切にします。","あなたは明るさや楽しい時間で相手を支えます。","あなたは具体的な行動で助けようとします。","あなたは無理に言葉を求めず、相手のペースを尊重します。"],details:["長所：共感力。ヒント：自分の気持ちも大切に。","長所：場を明るくする力。ヒント：相手が話したいときは聞き役に。","長所：実行力。ヒント：助言の前に気持ちを確認すると◎。","長所：落ち着きと配慮。ヒント：必要なら「話したくなったら聞くよ」と伝えて。"]},
deep:{title:"深層心理",q:"森の中で小さな箱を見つけました。箱の中に入っていたのは？",opts:["古い鍵","白い羽","小さな鏡","光る石"],names:["新しい扉を探す人","自由を求める人","自分を見つめる人","可能性を信じる人"],intro:["あなたは未知の可能性や新しい始まりに惹かれるのかも。","あなたは心の自由や、自分らしくいられる空間を大切にするのかも。","あなたは自分の本音を理解し、成長することに関心があるのかも。","あなたは希望や、まだ見ぬ可能性を大切にするのかも。"],details:["大切にしたいこと：挑戦。小さな一歩から始めてみて。","大切にしたいこと：余白。ひとりの時間も確保して。","大切にしたいこと：自己理解。気持ちを書き出すのもおすすめ。","大切にしたいこと：希望。夢を具体的な目標にしてみよう。"]},
fun:{title:"おもしろ診断",q:"不思議な自動販売機がひとつだけ願いを叶えてくれます。何を選ぶ？",opts:["いつでも満腹になる","どこでも瞬間移動できる","動物と話せる","一日をもう一度やり直せる"],names:["ほっこり満足タイプ","自由自在タイプ","好奇心全開タイプ","じっくり改善タイプ"],intro:["あなたは日々の快適さや小さな幸せを大切にするタイプ。","あなたは自由と新しい体験が大好きなタイプ。","あなたは未知の世界や相手の気持ちに興味津々なタイプ。","あなたは振り返りから学び、よりよくしたいタイプ。"],details:["幸せのヒント：好きなものを味わう時間を意識して。","幸せのヒント：小さな冒険を予定に入れてみて。","幸せのヒント：気になることを調べたり、誰かと話したりしてみて。","幸せのヒント：反省だけでなく、できたことも数えてみて。"]},
love:{title:"恋愛",q:"気になる人があなたに何かを渡してくれました。それは？",opts:["小さな花束","手書きのメッセージカード","お気に入りのお菓子","きれいな石やアクセサリー"],names:["情熱的なロマンチスト","心のつながりを大切にする人","自然体で楽しむ癒やし系","一途で絆を大切にする人"],intro:["あなたは愛情をストレートに表現してくれる人に惹かれるタイプ。","あなたは相手の言葉や気持ちを大切にし、深く理解し合える関係に惹かれるタイプ。","あなたは一緒にいて楽しく、自然体でいられる相手に惹かれるタイプ。","あなたは誠実さや、簡単には揺らがない深い絆を大切にするタイプ。"],details:["好きになるきっかけ：特別扱いや真っすぐな好意。大切なこと：愛情表現。気をつけたい点：反応を気にしすぎないこと。","好きになるきっかけ：理解してくれたと感じたとき。大切なこと：気持ちを言葉にすること。気をつけたい点：深読みしすぎないこと。","好きになるきっかけ：一緒に笑い、気を使わず過ごせたとき。大切なこと：居心地のよさ。気をつけたい点：本音を後回しにしないこと。","好きになるきっかけ：誠実さや言動の一致。大切なこと：信頼。気をつけたい点：相手を大切にしつつ自分も尊重すること。"]}
};
let current="",answer=0;
const home=document.getElementById("home"),quiz=document.getElementById("quiz"),result=document.getElementById("result");
function showCategory(key){current=key;const d=data[key];home.style.display="none";quiz.style.display="block";result.style.display="none";document.getElementById("catTitle").textContent=d.title;document.getElementById("question").textContent=d.q;const box=document.getElementById("choices");box.replaceChildren();d.opts.forEach((opt,i)=>{let b=document.createElement("button");b.className="choice";b.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'</span>';let s=document.createElement("span");s.textContent=opt;b.appendChild(s);b.onclick=()=>showResult(i);box.appendChild(b);});}
function showResult(i){answer=i;const d=data[current];document.getElementById("tag").textContent=String.fromCharCode(65+i)+"を選んだあなた";document.getElementById("resultTitle").textContent="あなたは「"+d.names[i]+"」";document.getElementById("intro").textContent=d.intro[i];document.getElementById("details").textContent="";let li=document.createElement("li");li.textContent=d.details[i];document.getElementById("details").appendChild(li);document.getElementById("outro").textContent="自分の傾向を知るヒントとして、気軽に楽しんでね。";result.style.display="block";result.scrollIntoView({behavior:"smooth"});}
document.querySelectorAll(".category").forEach(b=>b.onclick=()=>showCategory(b.dataset.cat));
document.getElementById("back").onclick=()=>{home.style.display="block";quiz.style.display="none";result.style.display="none";};
document.getElementById("retry").onclick=()=>{result.style.display="none";quiz.scrollIntoView({behavior:"smooth"});};
document.getElementById("share").onclick=()=>{let d=data[current],txt="心理テストで「"+d.names[answer]+"」タイプでした♡";window.open("https://line.me/R/msg/text/?"+encodeURIComponent(txt+" "+location.href),"_blank");};
</script></body></html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みんなの心理テスト</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#fff8fb,#f5f0ff);color:#503849;font-family:system-ui,"Yu Gothic",sans-serif}
main{max-width:760px;margin:auto;padding:20px 15px 45px}
header{text-align:center;padding:25px 10px}
h1{font-size:34px;color:#70415d;margin:10px 0}
header p{color:#947b8b}
.card{background:white;border:1px solid #f0d6e3;border-radius:22px;padding:22px;margin:15px 0;box-shadow:0 8px 24px #a34c7910}
h2{color:#70415d;font-size:22px;margin-top:0}
.categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.category{border:1px solid #f0d6e3;border-radius:17px;background:#fffafd;padding:18px 10px;color:#70415d;font:inherit;cursor:pointer}
.category strong{display:block;font-size:17px;margin:7px 0}
.category span{font-size:13px;color:#947b8b}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:1px solid #f0d6e3;border-radius:15px;background:#fffafd;font:inherit;text-align:left;color:#503849;cursor:pointer}
.choice:hover,.category:hover{background:#fff1f7;border-color:#d85f91}
.letter{display:grid;place-items:center;flex:0 0 36px;height:36px;border-radius:50%;background:#fbe0ec;color:#70415d;font-weight:bold}
button.primary{display:block;margin:15px auto 0;padding:12px 24px;border:0;border-radius:999px;background:#d85f91;color:white;font:inherit;font-weight:bold;cursor:pointer}
.secondary{background:#f6e7ef!important;color:#70415d!important}
.result{display:none}
.tag{display:inline-block;background:#fff0f6;color:#70415d;padding:6px 12px;border-radius:999px;font-size:13px}
#details{line-height:1.9;padding-left:22px}
footer{text-align:center;color:#947b8b;font-size:12px;margin-top:25px;line-height:1.8}
</style>
</head>
<body>
<main>

<header>
<div>♡ 直感で選ぶだけ ♡</div>
<h1>みんなの心理テスト</h1>
<p>気になるジャンルを選んで、気軽に診断してみよう！</p>
</header>

<!-- トップ画面 -->
<section class="card" id="home">
<h2>ジャンルを選んでね</h2>
<div class="categories">
<button class="category" data-cat="personality">🪞<strong>性格診断</strong><span>あなたの意外な一面</span></button>
<button class="category" data-cat="friendship">🤝<strong>友情・人間関係</strong><span>友達との関わり方</span></button>
<button class="category" data-cat="deep">🌙<strong>深層心理</strong><span>心の奥の願い</span></button>
<button class="category" data-cat="fun">🎭<strong>おもしろ診断</strong><span>気軽に楽しむ心理テスト</span></button>
<button class="category" data-cat="love">💗<strong>恋愛</strong><span>恋の傾向や価値観</span></button>
</div>
</section>

<!-- 質問画面 -->
<section class="card" id="quiz" style="display:none">
<h2 id="catTitle"></h2>
<p id="question"></p>
<div class="choices" id="choices"></div>
<button class="primary secondary" id="previous" style="display:none">← 質問に戻る</button>
</section>

<!-- 結果画面 -->
<section class="card result" id="result">
<span class="tag" id="tag"></span>
<h2 id="resultTitle"></h2>
<p id="intro"></p>
<ul id="details"></ul>
<p id="outro"></p>
<button class="primary" id="share">LINEでシェア</button>
<button class="primary secondary" id="retry">もう一度診断する</button>
<button class="primary secondary" id="homeButton">🏠 トップに戻る</button>
</section>

<footer>
※心理テストは娯楽としてお楽しみください。科学的な性格診断ではありません。
</footer>

</main>

<script>
const data={

personality:{
title:"性格診断",
q:"休日に知らない街を訪れました。最初にしたいことは？",
opts:["地図を見て名所を巡る","気になる路地を気ままに歩く","カフェに入って街の雰囲気を味わう","地元の人におすすめを聞く"],
names:["計画派の探究者","自由な冒険家","感性豊かな観察者","人とつながる交流家"],
intro:[
"あなたは見通しを立てて動くと安心できるタイプ。",
"あなたは好奇心に従って行動する自由人タイプ。",
"あなたは雰囲気や小さな発見を楽しむタイプ。",
"あなたは人との出会いから世界を広げるタイプ。"
],
details:[
"得意：段取りや目標設定。予定変更にも柔軟に対応できるとさらに◎。",
"得意：柔軟さと発想力。勢いだけで決めないことも大切。",
"得意：細やかな観察と感受性。考えすぎて疲れないように。",
"得意：会話や協力。相手に合わせすぎず自分の気持ちも大切に。"
]
},

friendship:{
title:"友情・人間関係",
q:"友達が落ち込んでいるとき、あなたがまずすることは？",
opts:["じっくり話を聞く","気分転換に誘う","役立ちそうな解決策を考える","そっとそばにいる"],
names:["聞き上手な寄り添いタイプ","ムードメーカータイプ","頼れるサポータータイプ","静かな安心感タイプ"],
intro:[
"あなたは相手の気持ちを受け止めることを大切にします。",
"あなたは明るさや楽しい時間で相手を支えます。",
"あなたは具体的な行動で助けようとします。",
"あなたは相手のペースを尊重するタイプです。"
],
details:[
"長所は共感力。自分の気持ちも大切にしてね。",
"長所は場を明るくする力。ときには聞き役になることも大切。",
"長所は実行力。助言の前に相手の気持ちを確認すると◎。",
"長所は落ち着きと配慮。必要なら「話したくなったら聞くよ」と伝えてみて。"
]
},

deep:{
title:"深層心理",
q:"森の中で小さな箱を見つけました。箱の中に入っていたのは？",
opts:["古い鍵","白い羽","小さな鏡","光る石"],
names:["新しい扉を探す人","自由を求める人","自分を見つめる人","可能性を信じる人"],
intro:[
"あなたは未知の可能性や新しい始まりに惹かれるのかも。",
"あなたは心の自由や、自分らしくいられる空間を大切にするのかも。",
"あなたは自分の本音を理解し、成長することに関心があるのかも。",
"あなたは希望や、まだ見ぬ可能性を大切にするのかも。"
],
details:[
"大切にしたいことは挑戦。小さな一歩から始めてみて。",
"大切にしたいことは余白。ひとりの時間も確保して。",
"大切にしたいことは自己理解。気持ちを書き出すのもおすすめ。",
"大切にしたいことは希望。夢を具体的な目標にしてみよう。"
]
},

fun:{
title:"おもしろ診断",
q:"不思議な自動販売機がひとつだけ願いを叶えてくれます。何を選ぶ？",
opts:["いつでも満腹になる","どこでも瞬間移動できる","動物と話せる","一日をもう一度やり直せる"],
names:["ほっこり満足タイプ","自由自在タイプ","好奇心全開タイプ","じっくり改善タイプ"],
intro:[
"あなたは日々の快適さや小さな幸せを大切にするタイプ。",
"あなたは自由と新しい体験が大好きなタイプ。",
"あなたは未知の世界や相手の気持ちに興味津々なタイプ。",
"あなたは振り返りから学び、よりよくしたいタイプ。"
],
details:[
"幸せのヒントは好きなものを味わう時間を作ること。",
"幸せのヒントは小さな冒険を予定に入れること。",
"幸せのヒントは気になることを調べたり、誰かと話したりすること。",
"幸せのヒントは反省だけでなく、できたことも数えること。"
]
},

love:{
title:"恋愛",
q:"気になる人があなたに何かを渡してくれました。それは？",
opts:["小さな花束","手書きのメッセージカード","お気に入りのお菓子","きれいな石やアクセサリー"],
names:["情熱的なロマンチスト","心のつながりを大切にする人","自然体で楽しむ癒やし系","一途で絆を大切にする人"],
intro:[
"あなたは愛情をストレートに表現してくれる人に惹かれるタイプ。",
"あなたは相手の言葉や気持ちを大切にし、深く理解し合える関係に惹かれるタイプ。",
"あなたは一緒にいて楽しく、自然体でいられる相手に惹かれるタイプ。",
"あなたは誠実さや、簡単には揺らがない深い絆を大切にするタイプ。"
],
details:[
"大切なのは愛情表現。相手の反応を気にしすぎないことも大事。",
"大切なのは気持ちを言葉にすること。深読みしすぎないように。",
"大切なのは居心地のよさ。本音を後回しにしないでね。",
"大切なのは信頼。相手と同じように自分も尊重してね。"
]
}

};

let current="";
let answer=0;

const home=document.getElementById("home");
const quiz=document.getElementById("quiz");
const result=document.getElementById("result");

function showCategory(key){
current=key;
const d=data[key];

home.style.display="none";
quiz.style.display="block";
result.style.display="none";

document.getElementById("catTitle").textContent=d.title;
document.getElementById("question").textContent=d.q;

const box=document.getElementById("choices");
box.replaceChildren();

d.opts.forEach((opt,i)=>{
const b=document.createElement("button");
b.className="choice";

const letter=document.createElement("span");
letter.className="letter";
letter.textContent=String.fromCharCode(65+i);

const text=document.createElement("span");
text.textContent=opt;

b.append(letter,text);
b.onclick=()=>showResult(i);
box.appendChild(b);
});

document.getElementById("previous").style.display="none";
window.scrollTo({top:0,behavior:"smooth"});
}

function showResult(i){
answer=i;
const d=data[current];

document.getElementById("tag").textContent=
String.fromCharCode(65+i)+"を選んだあなた";

document.getElementById("resultTitle").textContent=
"あなたは「"+d.names[i]+"」";

document.getElementById("intro").textContent=d.intro[i];

const details=document.getElementById("details");
details.replaceChildren();

const li=document.createElement("li");
li.textContent=d.details[i];
details.appendChild(li);

document.getElementById("outro").textContent=
"自分の傾向を知るヒントとして、気軽に楽しんでね。";

quiz.style.display="none";
result.style.display="block";
result.scrollIntoView({behavior:"smooth"});
}

function goHome(){
home.style.display="block";
quiz.style.display="none";
result.style.display="none";
window.scrollTo({top:0,behavior:"smooth"});
}

document.querySelectorAll(".category").forEach(button=>{
button.onclick=()=>showCategory(button.dataset.cat);
});

document.getElementById("homeButton").onclick=goHome;

document.getElementById("retry").onclick=()=>{
result.style.display="none";
showCategory(current);
};

document.getElementById("share").onclick=()=>{
const d=data[current];
const text="心理テストで「"+d.names[answer]+"」タイプでした♡";
const shareText=text+" "+location.href;
window.open("https://line.me/R/msg/text/?"+encodeURIComponent(shareText),"_blank");
};
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>性格診断｜心理テストの森</title>

  <link rel="stylesheet" href="style.css">

  <script src="personality-data.js"></script>
  <script src="app.js" defer></script>
</head>

<body>

<main class="container">

  <header class="site-header">
    <h1>🌷 性格診断</h1>
    <p>あなたの性格や魅力をチェックしてみよう！</p>
  </header>

  <!-- 診断一覧 -->
  <section id="menu-screen" class="page-panel">

    <p class="page-intro">
      気になる診断を選んでください
    </p>

    <div id="quiz-menu" class="quiz-menu">

      <button data-quiz="0">
        ① あなたの隠れた本当の性格
      </button>

      <button data-quiz="1">
        ② あなたが周囲に与えている印象
      </button>

      <button data-quiz="2">
        ③ あなたの意外な魅力
      </button>

    </div>

    <div class="sub-buttons">
      <button id="home-button">
        🏠 トップに戻る
      </button>
    </div>

  </section>

  <!-- 問題画面 -->
  <section id="question-screen"
           class="page-panel hidden">

    <p id="quiz-number"
       class="page-intro"></p>

    <h2 id="question-title"></h2>

    <p id="question-text"
       class="question"></p>

    <div id="answer-list"
         class="answer-list"></div>

    <div class="sub-buttons">

      <button id="back-to-menu">
        診断メニューに戻る
      </button>

    </div>

  </section>

  <!-- 結果画面 -->
  <section id="result-screen"
           class="page-panel hidden">

    <p class="page-intro">
      🌷 あなたの診断結果 🌷
    </p>

    <h2 id="result-title"></h2>

    <div id="result-details"></div>

    <div class="sub-buttons">

      <button id="share-button">
        LINEでシェア
      </button>

      <button id="retry-button">
        もう一度診断する
      </button>

      <button id="result-menu-button">
        診断メニューに戻る
      </button>

      <button id="result-home-button">
        🏠 トップに戻る
      </button>

    </div>

  </section>

</main>

</body>
</html>
